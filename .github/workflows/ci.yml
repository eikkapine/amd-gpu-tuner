name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Python ${{ matrix.python }} / Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: amd-gpu-tuner --version
  native:
    name: ADLX bridge / Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build against pinned ADLX SDK
        shell: pwsh
        run: ./scripts/build_bridge.ps1
